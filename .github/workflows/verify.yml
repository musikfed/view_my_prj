name: View My PRJ · independent project site QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate native HTML/CSS previews and public-only repository pages
        run: |
          node --check docs/assets/site.js
          node scripts/verify.mjs
