<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 355" width="640" height="355"><defs><linearGradient id="back" x2="0" y2="1"><stop stop-color="#142536"/><stop offset="1" stop-color="#0c1824"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7ab8b3"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e7f1f3} .sub{fill:#93afbf;font-size:14px}.tag{fill:#f0b779;font-size:13px;font-weight:700}.heading{font-size:19px;font-weight:700}.panel{fill:#192d3f;stroke:#4a677c;stroke-width:1.5}.accent{fill:#112e37;stroke:#65bda8;stroke-width:1.4}.line{fill:none;stroke:#7ab8b3;stroke-width:2.5;marker-end:url(#arrow)} .dotted{stroke-dasharray:5 6}</style><rect width="640" height="355" fill="url(#back)"/><text x="30" y="38" class="tag" text-anchor="start">RECOVERABLE TRANSACTION</text><rect x="35" y="82" width="185" height="95" rx="12" class="panel"/><text x="127" y="120" class="heading" text-anchor="middle">1 / PREPARE</text><text x="127" y="148" class="sub" text-anchor="middle">Stage files + register pending</text><path d="M223 126 L241 126" class="line "/><rect x="244" y="82" width="185" height="95" rx="12" class="accent"/><text x="336" y="120" class="heading" text-anchor="middle">2 / COMMIT</text><text x="336" y="148" class="sub" text-anchor="middle">Replace individual files</text><path d="M432 126 L450 126" class="line "/><rect x="453" y="82" width="185" height="95" rx="12" class="panel"/><text x="545" y="120" class="heading" text-anchor="middle">3 / VERIFY</text><text x="545" y="148" class="sub" text-anchor="middle">Hashes + SQLite manifest</text><path d="M350 182 L350 224" class="line "/><rect x="210" y="239" width="280" height="72" rx="12" class="panel"/><text x="350" y="273" class="heading" text-anchor="middle">RECOVERY ON INTERRUPTION</text><text x="350" y="297" class="sub" text-anchor="middle">Resume or rollback after review</text></svg>